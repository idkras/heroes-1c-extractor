# SonarQube Project Configuration for Heroes 1C Extractor
sonar.projectKey=heroes-1c-extractor
sonar.projectName=Heroes 1C Extractor
sonar.projectVersion=1.0.0

# Project description
sonar.projectDescription=Инструмент для извлечения и анализа данных из 1CD файлов

# Source code configuration
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.8,3.9,3.10,3.11,3.12

# Exclusions
sonar.exclusions=**/__pycache__/**,**/.*,**/node_modules/**,**/venv/**,**/.venv/**,**/build/**,**/dist/**,**/htmlcov/**,**/coverage.xml,**/temp/**,**/data/raw/**,**/data/exported/**,**/data/results/**,**/tools/**,**/dck1c/**,**/patches/**,**/notebooks/**,**/output_screenshots/**,**/prostosvet.ru/**,**/prostocvet-1c/**,**/heroes_platform/**,**/tools_ui_1c/**

# Test exclusions
sonar.test.exclusions=**/__pycache__/**,**/.*,**/node_modules/**,**/venv/**,**/.venv/**,**/build/**,**/dist/**,**/htmlcov/**,**/coverage.xml,**/temp/**,**/data/raw/**,**/data/exported/**,**/data/results/**,**/tools/**,**/dck1c/**,**/patches/**,**/notebooks/**,**/output_screenshots/**,**/prostosvet.ru/**,**/prostocvet-1c/**,**/heroes_platform/**,**/tools_ui_1c/**

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Code quality settings
sonar.python.bandit.reportPaths=bandit-report.json
sonar.python.pylint.reportPaths=pylint-report.txt

# Language settings
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# Analysis timeout
sonar.ws.timeout=300

